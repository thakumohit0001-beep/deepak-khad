<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepak Khad Bhandar - दीपक खाद भंडार</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9f4;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }
        header h1 { margin: 0; font-size: 28px; }
        header p { margin: 5px 0 0; font-size: 16px; color: #c8e6c9; }
        
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        h2 { color: #2e7d32; border-bottom: 2px solid #c8e6c9; padding-bottom: 5px; }
        
        /* Products Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .product-box {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 6px;
        }
        .product-box h4 { margin: 0 0 5px; color: #1b5e20; }
        .product-box p { margin: 3px 0; font-size: 14px; }
        .price { font-weight: bold; color: #d32f2f; }

        /* Form Styling */
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #1b5e20; }
        #msg { margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 Deepak Khad Bhandar (दीपक खाद भंडार)</h1>
        <p>यूरिया, DAP, उत्तम क्वालिटी के बीज और कीटनाशक दवाइयों के विक्रेता</p>
    </header>

    <div class="container">
        
        <!-- Products Section -->
        <div class="card">
            <h2>उपलब्ध सामान और मूल्य (Products List)</h2>
            <div id="productList" class="product-grid">
                <!-- Backend se products yahan load honge -->
            </div>
        </div>

        <!-- Order / Inquiry Form Section -->
        <div class="card">
            <h2>खाद या बीज बुक करें (Order / Inquiry Form)</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label>आपका नाम (Your Name):</label>
                    <input type="text" id="name" required placeholder="अपना पूरा नाम लिखें">
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर (Mobile Number):</label>
                    <input type="text" id="phone" required placeholder="10 अंकों का मोबाइल नंबर">
                </div>
                <div class="form-group">
                    <label>सामान चुनें (Select Item):</label>
                    <select id="itemSelect">
                        <option value="Yूरिया (Urea)">यूरिया (Urea)</option>
                        <option value="DAP (Diammonium Phosphate)">DAP (Diammonium Phosphate)</option>
                        <option value="NPK 12:32:16">NPK 12:32:16</option>
                        <option value="गेहूं का उन्नत बीज">गेहूं का उन्नत बीज</option>
                        <option value="धान का बीज">धान का बीज</option>
                        <option value="कीटनाशक दवा">कीटनाशक दवा</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>मात्रा / कट्टा (Quantity):</label>
                    <input type="text" id="quantity" placeholder="जैसे: 2 कट्टा या 5 किग्रा">
                </div>
                <button type="submit">ऑर्डर भेजें</button>
                <p id="msg"></p>
            </form>
        </div>

    </div>

    <script>
        // Backend se products fetch karke screen par dikhana
        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const productList = document.getElementById('productList');
                productList.innerHTML = '';

                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'product-box';
                    div.innerHTML = `
                        <h4>${p.name}</h4>
                        <p>श्रेणी: ${p.category}</p>
                        <p class="price">मूल्य: ${p.price}</p>
                    `;
                    productList.appendChild(div);
                });
            } catch (error) {
                console.error("Products load karne me error:", error);
            }
        }

        // Form submit hone par backend par data bhejna
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const item = document.getElementById('itemSelect').value;
            const quantity = document.getElementById('quantity').value;
            const msg = document.getElementById('msg');

            try {
                const response = await fetch('/api/inquiries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, item, quantity })
                });

                const result = await response.json();
                if (response.ok) {
                    msg.style.color = 'green';
                    msg.textContent = '✅ ' + result.message;
                    document.getElementById('orderForm').reset();
                } else {
                    msg.style.color = 'red';
                    msg.textContent = '❌ ' + result.error;
                }
            }
            catch (error) {
                msg.style.color = 'red';
                msg.textContent = '❌ Server se connect karne me samasya aayi.';
            }
        });

        // Page load hote hi products fetch karein
        fetchProducts();
    </script>
</body>
</html>
